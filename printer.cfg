[include mainsail.cfg]
[include ebb36.cfg]
[include cartographer.cfg]
[include macros.cfg]
[include shaketune.cfg]
[include autotune_tmc.cfg]
[include fan_tach_monitor.cfg]

[force_move]
enable_force_move: True

[mcu]
canbus_uuid: 932f6356ca10						# Insert the CANbus-UUID of your Manta from the firmware flashing steps

[printer]
kinematics: corexy
max_velocity: 500 
max_accel: 10000
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0

[input_shaper]
shaper_freq_x: 65.8 # center frequency for the X axis filter
shaper_type_x: mzv # filter type for the X axis
shaper_freq_y: 43.4 # center frequency for the Y axis filter
shaper_type_y: mzv # filter type for the Y axis
damping_ratio_x: 0.052 # damping ratio for the X axis
damping_ratio_y: 0.053 # damping ratio for the Y axis

[temperature_sensor Manta_M8P]
sensor_type: temperature_mcu

[temperature_sensor chamber]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PB0
gcode_id: chamber_temp

#####################################################################
# 	X/Y Stepper Settings
#####################################################################

## X Stepper on Motor1(B Motor)
[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: EBB:PA15 
position_min: 0

##	Uncomment for 350mm build
position_endstop: 350
position_max: 350

homing_speed: 80   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_x]
uart_pin: PC13
interpolate: True
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

## Y Stepper on Motor2 (A Motor)
[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: ^PF3
position_min: 0

##	Uncomment for 350mm build
position_endstop: 350
position_max: 350

homing_speed: 80  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_y]
uart_pin: PE3
interpolate: True
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# 	Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left on MOTOR3_A
[stepper_z]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
# Rotation Distance for TR8x8 = 8, TR8x4 = 4, TR8x2 = 2
rotation_distance: 4    
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -2.5
homing_speed: 8.0 # Leadscrews are slower than 2.4, 10 is a recommended max.
second_homing_speed: 3
homing_retract_dist: 0

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z]
uart_pin: PB9
interpolate: true
run_current: 0.6
sense_resistor: 0.110
#stealthchop_threshold: 0

##	Z1 Stepper - Rear  on Motor5
[stepper_z1]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB6
# Rotation Distance for TR8x8 = 8, TR8x4 = 4, TR8x2 = 2
rotation_distance: 4  
microsteps: 32

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
uart_pin: PB5
interpolate: true
run_current: 0.6
sense_resistor: 0.110
#stealthchop_threshold: 0

##	Z2 Stepper - Front Right on Motor6
[stepper_z2]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15
# Rotation Distance for TR8x8 = 8, TR8x4 = 4, TR8x2 = 2
rotation_distance: 4  
microsteps: 32

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: PG14
interpolate: true
run_current: 0.6
sense_resistor: 0.110
#stealthchop_threshold: 0

#####################################################################
# 	Extruder
#####################################################################

[extruder]
step_pin: EBB:PB14
dir_pin: !EBB:PA8
enable_pin: !EBB:PB6
microsteps: 16
rotation_distance: 22.17151657140539
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBB:PB4
sensor_type: Generic 3950
pullup_resistor: 2200
sensor_pin: EBB:PA3
#control: pid
#pid_kp: 57.369
#pid_ki: 2.533
#pid_kd: 324.854
min_temp: 0
max_temp: 300
pressure_advance: 0.037
pressure_advance_smooth_time: 0.020

[tmc2209 extruder]
uart_pin: EBB:PB3
run_current: 0.650
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PB1
max_power: 1.0
min_temp: 0
max_temp: 115
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

#####################################################################
# 	Fan Control
#####################################################################

[fan]
pin: EBB:PA5

[heater_fan hotend_fan]
pin: EBB:PD2
tachometer_pin: ^EBB:PA4
tachometer_poll_interval: 0.0006
heater: extruder
heater_temp: 50.0

[controller_fan EBB36]
pin: EBB:PD3
stepper: stepper_x
idle_timeout: 0
fan_speed: 0.5

[fan_generic the_filter]
##	The Filter Fans - CNC_FAN0
pin: PF7
kick_start_time: 0.5
cycle_time: 0.010

[controller_fan driver_fan]
pin: PF6
stepper: stepper_x
idle_timeout: 0
fan_speed: 0.5

[temperature_fan CM4]
##	Controller fan - CNC_FAN1
pin: PF9
control: watermark
max_delta: 3.0 
sensor_type: temperature_host
min_temp: 0 
max_temp: 85.0 
target_temp: 50.0
max_power: 0.5
kick_start_time: 0.5
shutdown_speed: 1.0

#####################################################################
# 	LED Control
#####################################################################

[neopixel chamber_lights]
pin: PD15
chain_count: 25
color_order: GRB
initial_GREEN: 0.39
initial_RED: 0.7
initial_BLUE: 0.39

[neopixel toolhead_lights]
pin: EBB:PC7
chain_count: 3
color_order: GRBW
initial_WHITE: 1.0

#####################################################################
# 	Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 3300

[safe_z_home]
##	Uncomment below for 350mm build
home_xy_position: 175,175

speed: 100
z_hop: 10

[z_tilt]
## Uncomment below for 350mm build
z_positions:
    -66, 11
    175, 402
    416, 11
points:
    30, 5
    175, 295
    320, 5

speed: 200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075

[bed_mesh]
zero_reference_position: 175, 175 # The centre of your bed. 
speed: 300
horizontal_move_z: 3
mesh_min: 35, 35 # The first probed coordinate, nearest to the origin. This coordinate is relative to the probe's location.
mesh_max: 315, 315 # The probed coordinate farthest from the origin. This is not necessarily the last point probed, as the probing process occurs in a zig-zag fashion. As with mesh_min, this coordinate is relative to the probe's location.
probe_count: 20, 20
adaptive_margin: 10
mesh_pps: 0,0 # Disable interpolation - mesh is probably dense enough

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE7, EXP1_2=PG1,
    EXP1_3=PG0, EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,    # Slot in the socket on this side
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,      # Slot in the socket on this side
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>

